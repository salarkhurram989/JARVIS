<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — Browser AI Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#02070d;color:#dffaff;font-family:Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#00d9ff08 1px,transparent 1px),linear-gradient(90deg,#00d9ff08 1px,transparent 1px);background-size:42px 42px}.app{height:100vh;display:grid;grid-template-columns:230px 1fr 230px;grid-template-rows:70px 1fr 65px;gap:12px;padding:12px}header,.panel,footer{border:1px solid #00d9ff35;background:#061421c9;backdrop-filter:blur(12px);border-radius:14px;box-shadow:0 0 30px #00aaff10}header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.logo{font-size:24px;font-weight:800;letter-spacing:6px}.logo span{color:#00e5ff}.online{font-size:11px;letter-spacing:2px;color:#7defff}.dot{display:inline-block;width:8px;height:8px;background:#25ff9a;border-radius:50%;box-shadow:0 0 12px #25ff9a;margin-right:8px}.panel{padding:18px}.title{font-size:10px;letter-spacing:3px;color:#60def5;margin-bottom:18px}.metric{padding:13px 0;border-bottom:1px solid #ffffff0d}.metric small{display:block;color:#66808f;font-size:9px;letter-spacing:2px}.metric b{font-size:18px;font-weight:500}.btn{display:block;width:100%;margin:9px 0;padding:11px;border:1px solid #00d9ff45;background:#00d9ff0d;color:#bdf8ff;border-radius:9px;cursor:pointer;text-align:left}.btn:hover{background:#00d9ff1b}.center{position:relative;display:flex;align-items:center;justify-content:center}.core{width:min(390px,55vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}.core:before,.core:after{content:"";position:absolute;border-radius:50%;inset:0;border:1px solid #00e5ff66}.core:before{inset:8%;border-style:dashed;animation:spin 12s linear infinite}.core:after{inset:20%;box-shadow:inset 0 0 40px #00cfff25,0 0 35px #00cfff22}.reactor{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#fff 0 5%,#8df6ff 9%,#00a6df 25%,#06354d 48%,transparent 68%);box-shadow:0 0 30px #00e5ff,0 0 90px #00aaff55;animation:pulse 2s infinite}.arc{position:absolute;inset:-5%;border-radius:50%;border:3px solid transparent;border-top-color:#00e5ff;border-left-color:#168cff55;animation:spin 5s linear infinite}.arc2{inset:15%;border-width:1px;border-right-color:#168cff;animation-direction:reverse;animation-duration:8s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.3)}}.corelabel{position:absolute;bottom:-35px;font-size:9px;letter-spacing:4px;color:#70dced}.messages{position:absolute;top:3%;width:min(680px,85%);max-height:150px;overflow:auto}.msg{padding:8px 11px;margin:5px 0;border-left:2px solid #00e5ff;background:#0003;font-size:12px}.user{border-left-color:#168cff}.chat{position:absolute;bottom:4%;width:min(680px,85%);display:flex;gap:8px}input{flex:1;padding:14px;border-radius:10px;border:1px solid #00d9ff45;background:#0007;color:white;outline:none}.send{padding:0 18px;border-radius:10px;border:1px solid #00d9ff66;background:#00d9ff12;color:#bdf8ff;cursor:pointer}.clock{font-size:22px}.date{font-size:9px;color:#66808f;letter-spacing:1px}footer{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#587786;font-size:9px;letter-spacing:2px}.mic{width:50px;height:50px;border-radius:50%;border:1px solid #00d9ff88;background:#00d9ff0d;color:#bdf8ff;font-size:20px;cursor:pointer}@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:62px 1fr 62px;padding:7px}.panel{display:none}header,footer{grid-column:1}.core{width:min(78vw,370px)}.chat,.messages{width:90%}}
</style></head>
<body><div class="app">
<header><div class="logo">JAR<span>VIS</span></div><div class="online"><i class="dot"></i>SYSTEM ONLINE</div><div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">---</div></div></header>
<aside class="panel"><div class="title">SYSTEM DIAGNOSTICS</div><div class="metric"><small>CORE</small><b>ONLINE</b></div><div class="metric"><small>VOICE ENGINE</small><b id="voice">READY</b></div><div class="metric"><small>INTERFACE</small><b>100%</b></div><div class="metric"><small>NETWORK</small><b>CONNECTED</b></div><div class="title" style="margin-top:25px">QUICK COMMANDS</div><button class="btn" onclick="command('What time is it?')">TIME</button><button class="btn" onclick="command('Open Google')">GOOGLE</button><button class="btn" onclick="command('Open YouTube')">YOUTUBE</button></aside>
<main class="center"><div class="messages" id="messages"></div><div class="core"><div class="arc"></div><div class="arc arc2"></div><div class="reactor"></div><div class="corelabel">JARVIS CORE // ACTIVE</div></div><div class="chat"><input id="input" placeholder="Give me a command..."><button class="send" onclick="command()">SEND</button></div></main>
<aside class="panel"><div class="title">ASSISTANT</div><div class="metric"><small>MODE</small><b>JARVIS</b></div><div class="metric"><small>LANGUAGE</small><b>EN-US</b></div><div class="metric"><small>SECURITY</small><b>ACTIVE</b></div><div class="title" style="margin-top:25px">VOICE</div><button class="btn" onclick="listen()">🎙 START LISTENING</button><button class="btn" onclick="speak('Good to see you. How may I assist?')">🔊 TEST VOICE</button></aside>
<footer><span>JARVIS BROWSER INTERFACE</span><button class="mic" onclick="listen()">🎙</button><span>VOICE COMMANDS ENABLED</span></footer></div>
<script>
const input=document.getElementById('input'),msgs=document.getElementById('messages');
function add(t,u=false){let d=document.createElement('div');d.className='msg '+(u?'user':'');d.textContent=(u?'YOU: ':'JARVIS: ')+t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.96;u.pitch=.82;speechSynthesis.speak(u)}
function command(t){t=(t??input.value).trim();if(!t)return;input.value='';add(t,true);let q=t.toLowerCase(),r;if(q.includes('time'))r='The current time is '+new Date().toLocaleTimeString();else if(q.includes('date')||q.includes('day'))r='Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});else if(q.includes('google')){r='Opening Google.';open('https://google.com')}else if(q.includes('youtube')){r='Opening YouTube.';open('https://youtube.com')}else if(q.includes('github')){r='Opening GitHub.';open('https://github.com')}else if(q.startsWith('search')){let x=t.replace(/^search( for)?/i,'').trim();r='Searching for '+x;open('https://www.google.com/search?q='+encodeURIComponent(x))}else if(q.includes('hello')||q.includes('hi'))r='Good day. JARVIS is online and ready.';else r='I heard you. Browser JARVIS currently handles voice commands, websites, time and web searches.';add(r);speak(r)}
input.addEventListener('keydown',e=>{if(e.key==='Enter')command()});function open(u){window.open(u,'_blank')}
function listen(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){add('Voice recognition is not supported. Please use Chrome.');return}let r=new S();r.lang='en-US';document.getElementById('voice').textContent='LISTENING';r.onresult=e=>{input.value=e.results[0][0].transcript;command()};r.onend=()=>document.getElementById('voice').textContent='READY';r.start()}
function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString();date.textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}setInterval(tick,1000);tick();add('Systems initialized. JARVIS is standing by.');
</script></body></html>
