<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS — Clean HUD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#02070c;color:#dffaff;font:14px Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,210,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}.app{height:100%;padding:18px;display:grid;grid-template-columns:220px minmax(0,1fr) 220px;grid-template-rows:58px minmax(0,1fr) 58px;gap:12px}header,.panel,footer{background:rgba(5,15,24,.78);border:1px solid rgba(0,210,255,.16);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.22);backdrop-filter:blur(16px)}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:20px;font-weight:700;letter-spacing:7px}.logo span{color:#00d9ff}.online{font-size:9px;letter-spacing:2px;color:#72d9e8}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#46f0b0;box-shadow:0 0 8px #46f0b0;margin-right:7px}.time{text-align:right}.clock{font-size:16px;letter-spacing:1px}.date{font-size:8px;color:#58727f;letter-spacing:1px;margin-top:2px}.panel{padding:18px}.title{font-size:8px;color:#5bbccc;letter-spacing:3px;margin-bottom:16px}.metric{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055)}.metric small{display:block;color:#4e6977;font-size:8px;letter-spacing:2px;margin-bottom:5px}.metric b{font-size:14px;font-weight:500}.btn,.linkbtn{width:100%;display:block;padding:10px 11px;margin:8px 0;border:1px solid rgba(0,210,255,.18);border-radius:8px;background:rgba(0,210,255,.035);color:#b9edf4;text-decoration:none;text-align:left;font-size:11px;cursor:pointer}.btn:hover,.linkbtn:hover{border-color:rgba(0,210,255,.5);background:rgba(0,210,255,.08)}.center{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}.hud{position:absolute;width:min(570px,70%);height:min(570px,70%);border:1px solid rgba(0,210,255,.12);border-radius:50%}.hud:before{content:"";position:absolute;inset:12%;border:1px solid rgba(0,210,255,.18);border-radius:50%}.hud:after{content:"";position:absolute;inset:27%;border:1px dashed rgba(0,210,255,.16);border-radius:50%;animation:rotate 18s linear infinite}.ticks{position:absolute;inset:-3%;border-radius:50%;border-top:2px solid #00d9ff;border-right:1px solid transparent;transform:rotate(25deg);opacity:.65}.reactor{position:relative;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#fff 0 4%,#baf9ff 7%,#009dcc 22%,#06384c 45%,#02070c 67%);box-shadow:0 0 22px rgba(0,217,255,.8),0 0 65px rgba(0,150,220,.25);animation:pulse 2.5s ease-in-out infinite}.reactor:before{content:"";position:absolute;inset:22px;border:1px solid rgba(255,255,255,.55);border-radius:50%}.reactor:after{content:"JARVIS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;letter-spacing:2px;color:#dfffff}.coreinfo{position:absolute;top:7%;text-align:center}.coreinfo strong{display:block;font-size:10px;letter-spacing:3px;font-weight:500;color:#8eeaf4}.coreinfo span{font-size:8px;color:#496a77;letter-spacing:2px}.messages{position:absolute;left:4%;top:5%;width:min(430px,50%);max-height:120px;overflow:auto}.msg{padding:7px 9px;margin:4px 0;border-left:1px solid #00d9ff;background:rgba(0,10,16,.45);font-size:10px;color:#9dc4cc}.user{border-left-color:#478dff;color:#a9c9ef}.chat{position:absolute;bottom:4%;width:min(560px,75%);display:flex;gap:7px}input{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid rgba(0,210,255,.2);background:rgba(0,0,0,.35);color:#fff;outline:none}input:focus{border-color:rgba(0,210,255,.55)}.send{padding:0 18px;border:1px solid rgba(0,210,255,.35);border-radius:8px;background:rgba(0,210,255,.07);color:#bff7ff;cursor:pointer}.send:hover{background:rgba(0,210,255,.14)}footer{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#496873;font-size:8px;letter-spacing:2px}.mic{width:42px;height:42px;border-radius:50%;border:1px solid rgba(0,210,255,.45);background:rgba(0,210,255,.06);color:#c5f9ff;cursor:pointer}.mic:hover{box-shadow:0 0 18px rgba(0,210,255,.2)}@keyframes pulse{50%{transform:scale(1.045);filter:brightness(1.12)}}@keyframes rotate{to{transform:rotate(360deg)}}@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:58px minmax(0,1fr) 58px;padding:8px}.panel{display:none}.coreinfo{top:4%}.hud{width:78vw;height:78vw}.messages{left:5%;width:90%}.chat{width:90%}} </style></head><body><div class="app"><header><div class="logo">JAR<span>VIS</span></div><div class="online"><i class="dot"></i>SYSTEM ONLINE</div><div class="time"><div class="clock" id="clock">--:--:--</div><div class="date" id="date">---</div></div></header><aside class="panel"><div class="title">SYSTEM STATUS</div><div class="metric"><small>CORE</small><b>ONLINE</b></div><div class="metric"><small>VOICE</small><b id="voice">READY</b></div><div class="metric"><small>NETWORK</small><b>CONNECTED</b></div><div class="title" style="margin-top:24px">SHORTCUTS</div><button class="btn" onclick="command('What time is it?')">TIME</button><a class="linkbtn" href="https://www.google.com" target="_blank" rel="noopener">GOOGLE ↗</a><a class="linkbtn" href="https://www.youtube.com" target="_blank" rel="noopener">YOUTUBE ↗</a><a class="linkbtn" href="https://github.com" target="_blank" rel="noopener">GITHUB ↗</a></aside><main class="center"><div class="coreinfo"><strong>JARVIS CORE</strong><span>ACTIVE • LOCAL MODE</span></div><div class="hud"><div class="ticks"></div></div><div class="reactor"></div><div class="messages" id="messages"></div><div class="chat"><input id="input" placeholder="Command JARVIS..."><button class="send" onclick="command()">SEND</button></div></main><aside class="panel"><div class="title">ASSISTANT</div><div class="metric"><small>MODE</small><b>JARVIS</b></div><div class="metric"><small>LANGUAGE</small><b>EN-US</b></div><div class="metric"><small>SECURITY</small><b>ACTIVE</b></div><div class="title" style="margin-top:24px">VOICE CONTROL</div><button class="btn" onclick="listen()">🎙 START LISTENING</button><button class="btn" onclick="testVoice()">🔊 TEST VOICE</button><a class="linkbtn" href="https://aivoicelab.net/en/role/jarvis-voice" target="_blank" rel="noopener">JARVIS VOICE ↗</a></aside><footer><span>JARVIS BROWSER HUD</span><button class="mic" onclick="listen()">🎙</button><span>VOICE COMMANDS ENABLED</span></footer></div><script>const input=document.getElementById('input'),msgs=document.getElementById('messages');function add(t,u=false){const d=document.createElement('div');d.className='msg '+(u?'user':'');d.textContent=(u?'YOU: ':'JARVIS: ')+t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.94;u.pitch=.78;const v=speechSynthesis.getVoices().find(x=>/jarvis|daniel|alex|microsoft guy/i.test(x.name));if(v)u.voice=v;speechSynthesis.speak(u)}function testVoice(){speak('Good to see you. How may I assist?')}function go(u){window.location.assign(u)}function command(t){t=(t??input.value).trim();if(!t)return;input.value='';add(t,true);const q=t.toLowerCase();let r;if(q.includes('time'))r='The current time is '+new Date().toLocaleTimeString();else if(q.includes('date')||q.includes('day'))r='Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});else if(q.includes('youtube')){r='Opening YouTube.';add(r);speak(r);return go('https://www.youtube.com')}else if(q.includes('github')){r='Opening GitHub.';add(r);speak(r);return go('https://github.com')}else if(q.includes('google')){r='Opening Google.';add(r);speak(r);return go('https://www.google.com')}else if(q.startsWith('search')){const x=t.replace(/^search( for)?/i,'').trim();r='Searching for '+x;add(r);speak(r);return go('https://www.google.com/search?q='+encodeURIComponent(x))}else if(q.includes('hello')||q.includes('hi'))r='Good day. JARVIS is online and ready.';else r='I heard you. I can open websites, search the web, tell the time and respond to voice commands.';add(r);speak(r)}input.addEventListener('keydown',e=>{if(e.key==='Enter')command()});function listen(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){add('Voice recognition is not supported here. Please use Chrome.');return}const r=new S();r.lang='en-US';r.interimResults=false;document.getElementById('voice').textContent='LISTENING';r.onresult=e=>{input.value=e.results[0][0].transcript;command()};r.onerror=()=>document.getElementById('voice').textContent='READY';r.onend=()=>document.getElementById('voice').textContent='READY';r.start()}function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString();document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}setInterval(tick,1000);tick();add('Systems initialized. JARVIS is standing by.');</script></body></html>
