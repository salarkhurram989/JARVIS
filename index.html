<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — AI HUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#02070c;color:#dffaff;font:14px Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,210,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}.app{height:100%;padding:16px;display:grid;grid-template-columns:220px minmax(0,1fr) 220px;grid-template-rows:58px minmax(0,1fr) 58px;gap:12px}header,.panel,footer{background:rgba(5,15,24,.82);border:1px solid rgba(0,210,255,.16);border-radius:12px;box-shadow:0 10px 40px #0005;backdrop-filter:blur(16px)}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:20px;font-weight:700;letter-spacing:7px}.logo span{color:#00d9ff}.online{font-size:9px;letter-spacing:2px;color:#72d9e8}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#46f0b0;box-shadow:0 0 8px #46f0b0;margin-right:7px}.time{text-align:right}.clock{font-size:16px}.date{font-size:8px;color:#58727f;letter-spacing:1px}.panel{padding:18px}.title{font-size:8px;color:#5bbccc;letter-spacing:3px;margin-bottom:16px}.metric{padding:11px 0;border-bottom:1px solid #fff1}.metric small{display:block;color:#4e6977;font-size:8px;letter-spacing:2px;margin-bottom:5px}.metric b{font-size:14px;font-weight:500}.btn,.linkbtn{width:100%;display:block;padding:10px 11px;margin:8px 0;border:1px solid #00d2ff2e;border-radius:8px;background:#00d2ff09;color:#b9edf4;text-decoration:none;text-align:left;font-size:11px;cursor:pointer}.btn:hover,.linkbtn:hover{border-color:#00d2ff88;background:#00d2ff14}.center{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}.hud{position:absolute;width:min(560px,68%);height:min(560px,68%);border:1px solid #00d2ff20;border-radius:50%}.hud:before{content:"";position:absolute;inset:12%;border:1px solid #00d2ff2e;border-radius:50%}.hud:after{content:"";position:absolute;inset:28%;border:1px dashed #00d2ff2b;border-radius:50%;animation:rotate 18s linear infinite}.ticks{position:absolute;inset:-3%;border-radius:50%;border-top:2px solid #00d9ff;border-right:1px solid transparent;transform:rotate(25deg);opacity:.65}.reactor{position:relative;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#fff 0 4%,#baf9ff 7%,#009dcc 22%,#06384c 45%,#02070c 67%);box-shadow:0 0 22px #00d9ffc0,0 0 65px #0096dc40;animation:pulse 2.5s ease-in-out infinite}.reactor:before{content:"";position:absolute;inset:22px;border:1px solid #fff8;border-radius:50%}.reactor:after{content:"JARVIS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;letter-spacing:2px}.coreinfo{position:absolute;top:7%;text-align:center}.coreinfo strong{display:block;font-size:10px;letter-spacing:3px;color:#8eeaf4}.coreinfo span{font-size:8px;color:#496a77;letter-spacing:2px}.messages{position:absolute;left:4%;top:5%;width:min(560px,65%);max-height:220px;overflow:auto}.msg{padding:8px 10px;margin:5px 0;border-left:1px solid #00d9ff;background:#000a102e;font-size:11px;color:#a9cbd2;line-height:1.45}.user{border-left-color:#478dff;color:#b6d3f2}.thinking{color:#68dbea}.error{border-left-color:#ff6978;color:#ffb0b8}.chat{position:absolute;bottom:4%;width:min(620px,78%);display:flex;gap:7px}input{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid #00d2ff33;background:#00000059;color:#fff;outline:none}input:focus{border-color:#00d2ff88}.send{padding:0 18px;border:1px solid #00d2ff59;border-radius:8px;background:#00d2ff12;color:#bff7ff;cursor:pointer}.send:hover{background:#00d2ff24}footer{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#496873;font-size:8px;letter-spacing:2px}.mic{width:42px;height:42px;border-radius:50%;border:1px solid #00d2ff73;background:#00d2ff0f;color:#c5f9ff;cursor:pointer}.mic:hover{box-shadow:0 0 18px #00d2ff33}@keyframes pulse{50%{transform:scale(1.045);filter:brightness(1.12)}}@keyframes rotate{to{transform:rotate(360deg)}}@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:58px minmax(0,1fr) 58px;padding:8px}.panel{display:none}.coreinfo{top:4%}.hud{width:78vw;height:78vw}.messages{left:5%;width:90%}.chat{width:90%}}
</style></head>
<body><div class="app">
<header><div class="logo">JAR<span>VIS</span></div><div class="online"><i class="dot"></i><span id="online">AI SYSTEM READY</span></div><div class="time"><div class="clock" id="clock">--:--:--</div><div class="date" id="date">---</div></div></header>
<aside class="panel"><div class="title">SYSTEM STATUS</div><div class="metric"><small>CORE</small><b>ONLINE</b></div><div class="metric"><small>AI</small><b id="aiStatus">READY</b></div><div class="metric"><small>VOICE</small><b id="voiceStatus">READY</b></div><div class="title" style="margin-top:24px">SHORTCUTS</div><button class="btn" onclick="ask('What time is it?')">TIME</button><a class="linkbtn" href="https://www.google.com" target="_blank" rel="noopener">GOOGLE ↗</a><a class="linkbtn" href="https://www.youtube.com" target="_blank" rel="noopener">YOUTUBE ↗</a><a class="linkbtn" href="https://github.com" target="_blank" rel="noopener">GITHUB ↗</a></aside>
<main class="center"><div class="coreinfo"><strong>JARVIS CORE</strong><span>GEMINI AI • ACTIVE</span></div><div class="hud"><div class="ticks"></div></div><div class="reactor"></div><div class="messages" id="messages"></div><div class="chat"><input id="input" placeholder="Ask JARVIS anything..."><button class="send" onclick="ask()">SEND</button></div></main>
<aside class="panel"><div class="title">ASSISTANT</div><div class="metric"><small>MODE</small><b>JARVIS AI</b></div><div class="metric"><small>MODEL</small><b>GEMINI</b></div><div class="metric"><small>SEARCH</small><b>GROUNDED</b></div><div class="title" style="margin-top:24px">VOICE CONTROL</div><button class="btn" onclick="listen()">🎙 START LISTENING</button><button class="btn" onclick="testVoice()">🔊 TEST VOICE</button><a class="linkbtn" href="https://aivoicelab.net/en/role/jarvis-voice" target="_blank" rel="noopener">JARVIS VOICE ↗</a></aside>
<footer><span>JARVIS • GEMINI CONNECTED</span><button class="mic" onclick="listen()">🎙</button><span>ASK ANYTHING</span></footer></div>
<script>
const synth=window.speechSynthesis,input=document.getElementById('input'),msgs=document.getElementById('messages');
const API_URL=window.JARVIS_API_URL||'https://YOUR-BACKEND-URL/api/chat';let voices=[],voice=null;
function loadVoices(){voices=synth.getVoices();voice=voices.find(v=>/jarvis/i.test(v.name))||voices.find(v=>/daniel|alex|guy|david/i.test(v.name)&&/^en/i.test(v.lang))||voices.find(v=>/^en-US/i.test(v.lang)&&v.localService)||voices.find(v=>/^en/i.test(v.lang))||voices.find(v=>v.default)||voices[0]||null}loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
function add(text,type=''){const d=document.createElement('div');d.className='msg '+type;d.textContent=(type==='user'?'YOU: ':'JARVIS: ')+text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function speak(text){if(!('speechSynthesis'in window))return;synth.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang='en-US';u.rate=.98;u.pitch=.8;u.volume=1;synth.speak(u)}
function testVoice(){speak('Good to see you. How may I assist?')}
async function ask(text){text=(text??input.value).trim();if(!text)return;input.value='';add(text,'user');document.getElementById('aiStatus').textContent='THINKING';document.getElementById('online').textContent='PROCESSING';const wait=add('Processing your request...','thinking');try{if(API_URL.includes('YOUR-BACKEND-URL'))throw new Error('Backend URL is not configured yet.');const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Backend request failed.');wait.remove();add(data.answer||'I could not generate a response.');speak(data.answer||'I could not generate a response.')}catch(err){wait.remove();add(err.message,'error');speak('I cannot reach my Gemini backend yet.')}finally{document.getElementById('aiStatus').textContent='READY';document.getElementById('online').textContent='AI SYSTEM READY'}}
input.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
function listen(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){add('Voice recognition is not supported here. Please use Chrome.','error');return}const r=new S();r.lang='en-US';r.interimResults=false;r.continuous=false;document.getElementById('voiceStatus').textContent='LISTENING';r.onresult=e=>{input.value=e.results[0][0].transcript;ask()};r.onerror=()=>document.getElementById('voiceStatus').textContent='READY';r.onend=()=>document.getElementById('voiceStatus').textContent='READY';r.start()}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString();document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}setInterval(tick,1000);tick();add('Systems initialized. Gemini AI interface standing by.');
</script></body></html>
