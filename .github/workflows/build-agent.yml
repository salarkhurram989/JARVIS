name: Build JARVIS Windows Installer
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-agent.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build agent EXE
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install pyinstaller psutil
          py -m PyInstaller --onefile --noconsole --name JARVIS-PC-Agent desktop/agent.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build JARVIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\installer.iss

      - name: Upload JARVIS Setup
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-Windows
          path: desktop\installer\JARVIS-Setup.exe

      - name: Upload portable agent
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-PC-Agent-Windows
          path: dist\JARVIS-PC-Agent.exe
